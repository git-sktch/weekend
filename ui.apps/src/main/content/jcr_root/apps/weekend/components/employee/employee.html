<sly data-sly-use.employeeModel="com.weekend.core.models.EmployeeModel">

    <table border="1" cellpadding="10" cellspacing="0">

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
        </tr>
        </thead>

        <tbody>

        <sly data-sly-list.employee="${employeeModel.employees}">

            <tr>
                <td>${employee.id}</td>
                <td>${employee.name}</td>
                <td>${employee.role}</td>
                <td>${employee.email}</td>
            </tr>

        </sly>

        </tbody>

    </table>

</sly>
