<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>
<sly data-sly-use.model="com.weekend.core.models.DynamicListModel"/>

<sly data-sly-call="${clientlib.css @ categories='weekend.dynamiclist'}"/>

<div class="dynamic-list" data-sly-list.item="${model.pages}">

    <div class="dynamic-item">

        <h3>
            <a href="${item.path}.html">
                ${item.title}
            </a>
        </h3>

        <p>${item.description}</p>

        <a href="${item.path}.html" class="read-more">
            More
        </a>

    </div>

</div>
